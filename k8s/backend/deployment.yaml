apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: task-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  strategy:                # ✅ Rolling update strategy
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1    # how many pods can be unavailable during update
      maxSurge: 1          # how many extra pods can be created temporarily
  template:
    metadata:
      labels:
        app: backend
    spec:
      nodeSelector:
        workload: backend
      serviceAccountName: backend-sa
      containers:
        - name: backend
          image: task-platform-backend:1.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret
          ports:
            - containerPort: 5000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

apiVersion: apps/v1

kind: Deployment

metadata:
  name: backend
  namespace: task-platform

spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
        - name: backend
          image: task-platform-backend:1.0
          imagePullPolicy: IfNotPresent

          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret

          ports:
            - containerPort: 5000
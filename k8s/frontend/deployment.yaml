apiVersion: apps/v1

kind: Deployment

metadata:
  name: frontend
  namespace: task-platform

spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend
          image: task-platform-frontend:1.0
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 80